name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
      - name: Install worker dependencies
        run: npm install --prefix worker
      - name: Test dynamic FUTEX parser
        run: npm test --prefix worker
      - name: Test secure Vercel proxy
        run: node --test tests/proxy.test.js tests/password-change.test.js
      - name: Check worker and Vercel proxy syntax
        run: npm run check --prefix worker && node --check api/worker.js && node --check api/auth/login.js && node --check api/auth/password.js
