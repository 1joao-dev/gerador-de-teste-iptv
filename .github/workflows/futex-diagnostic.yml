name: FUTEX live diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/futex-automation.js"
      - "worker/futex-parser.js"
      - "worker/futex-diagnostic.js"
      - ".github/workflows/futex-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install worker dependencies
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: worker
        run: npx playwright install --with-deps chromium

      - name: Inspect the live FUTEX chatbot
        working-directory: worker
        env:
          FUTEX_URL: https://futex.com.br/teste/
          FUTEX_HEADLESS: "true"
        run: node futex-diagnostic.js

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futex-live-diagnostic
          path: worker/futex-diagnostic-report.json
          if-no-files-found: warn
          retention-days: 3
